<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>База ответов КТ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f5f7; color: #1d1f23; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #e2e4e8; padding: 12px 16px; }
  .bar { display: flex; gap: 8px; max-width: 1300px; margin: 0 auto; }
  #q { flex: 1; min-width: 0; font-size: 17px; padding: 11px 14px; border: 2px solid #c9ccd3; border-radius: 10px; outline: none; }
  #q:focus { border-color: #ef3124; }
  #topic { max-width: 280px; padding: 0 8px; border: 1px solid #c9ccd3; border-radius: 10px; background: #fff; font-size: 14px; }
  .legend { max-width: 1300px; margin: 8px auto 0; font-size: 12.5px; color: #5c616b; display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  main { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; max-width: 1300px; margin: 16px auto; padding: 0 16px; }
  #list { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; overflow: auto; max-height: calc(100vh - 150px); }
  #list .item { padding: 9px 12px; border-bottom: 1px solid #eef0f2; cursor: pointer; }
  #list .item:hover { background: #f7f8fa; }
  #list .item.sel { background: #fff1f0; border-left: 4px solid #ef3124; padding-left: 8px; }
  #list .item .tp { font-size: 11.5px; color: #7a808a; }
  #list .info { padding: 16px; color: #5c616b; }
  mark { background: #ffe58a; color: inherit; padding: 0 1px; border-radius: 2px; }
  #view { background: #fff; border: 1px solid #e2e4e8; border-radius: 10px; padding: 18px 20px; align-self: start; position: sticky; top: 130px; max-height: calc(100vh - 150px); overflow: auto; }
  #view .tp { display: inline-block; font-size: 12px; background: #eef0f3; color: #4a4f57; padding: 3px 8px; border-radius: 6px; }
  #view h2 { font-size: 18px; margin: 10px 0 4px; line-height: 1.35; }
  #view .kind { font-size: 12.5px; color: #7a808a; margin-bottom: 12px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid #e2e4e8; border-radius: 8px; margin-bottom: 7px; color: #6b7079; }
  .opt b { flex: none; width: 20px; text-align: center; }
  .opt.ok { background: #e3f6e8; border-color: #34a853; color: #0f5a25; font-weight: 600; }
  .opt.bad { background: #fde7e6; border-color: #e53935; color: #a1110a; }
  .opt.maybe { background: #fff6d6; border-color: #e0b300; color: #6b5300; font-weight: 600; }
  .opt small { display: block; font-weight: 400; font-size: 12px; }
  .note { margin-top: 12px; padding: 9px 12px; border-radius: 8px; background: #eef3ff; color: #23407a; font-size: 13.5px; }
  .note.warn { background: #fff3e0; color: #8a4b00; }
  .ai { margin-top: 14px; padding: 10px 12px; border-radius: 8px; border: 1px dashed #9a7bd6; background: #f6f1ff; color: #3b2a63; font-size: 13.5px; }
  .ai b { display: inline-block; font-size: 11.5px; letter-spacing: .3px; text-transform: uppercase; background: #7a5bc4; color: #fff; padding: 1px 7px; border-radius: 5px; margin-bottom: 5px; }
  .none { color: #d32f2f; font-weight: 700; font-size: 18px; }
  .muted { color: #7a808a; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    #view { position: static; max-height: none; order: -1; }
    #list { max-height: 45vh; }
    .bar { flex-wrap: wrap; }
    #topic { max-width: none; width: 100%; height: 38px; }
  }
</style>
</head>
<body>
<header>

</header>
<main>

</main>

банке на главной странице и предупредить, что могут запросить подтверждающие документы",1]],"n":[]},{"t":"Комплаенс-риски","q":"Открытие каких счетов обязательно нужно согласовывать с руководителем?","o":[["С рисковым видом деятельности",1],["Если номинальный директор",0],["Все",0],["Если открываем счёт с AML-лимитами",0]],"n":[],"a":"С руководителем согласуют счёт клиента с рисковым видом деятельности."},{"t":"Комплаенс-риски","q":"Представьте, что банк не будет использовать комплаенс в работе. Что тогда может произойти?","o":[["У банка могут отобрать лицензию",1],["К банку могут быть применены санкции со стороны надзорных органов",1],["Банк может потерять репутацию надежного делового партнёра в банковской среде",1]],"n":[]},{"t":"Комплаенс-риски","q":"У клиента вопрос: \"Могу ли я снимать по 5 млн рублей наличными на покупку оборудования?\" Какие рекомендации мы должны дать клиенту?","o":[["Взаиморасчет между ЮЛ не более 100 000 рублей в рамках одного договора. - Банк не увидит сделку, т.к. по выписке пройдет только снятие наличных, поэтому запросит документы или применит ограничение интернет-банка",1],["Если на покупку оборудования, то вопросов не возникнет",0],["30% и более снятия в течение недели поступивших денег — риск блокировки карты по 115-ФЗ",1]],"n":[],"a":"Наличные между юрлицами — не больше 100 тыс. ₽ по одному договору. Частое снятие (30% и больше поступлений за неделю) — риск блокировки по 115-ФЗ."},{"t":"Комплаенс-риски","q":"У клиента при открытии счета есть запрет 003 в \"базе репутационные риски\", а клиент хочет оформить ЗП-проект, что можем предложить клиенту?","o":[["Открыть счет с AML-лимитами, а после открытия счета оформить ЗП проект",0],["Открыть счет на любом ПУ, пройдя процедуру исключения из Базы репутационные риски",1],["Открыть счёт с AML-лимитами, а после открытия счета исключить из базы репутационные риски, чтобы перевести клиента на другой ПУ для оформления ЗП проекта",0]],"n":[]},{"t":"Комплаенс-риски","q":"Чем для клиента принципиально отличается отказ в проведении операции на основании 115-ФЗ от отказа на основании п. 5.7 ДРКО?","o":[["Отказ по 115-ФЗ влияет на репутацию клиента, а по п.5.7. – нет",1],["При отказе по п. 5.7 ДРКО запускается процедура расторжения договора РКО в одностороннем порядке",0],["Для клиента нет разницы",0]],"n":[],"a":"Главное отличие: отказ по 115-ФЗ уходит в ЦБ (портит репутацию клиента), а отказ по п.5.7 ДРКО — нет."},{"t":"Комплаенс-риски","q":"Что означает признак в комплаенс-листе \"отсутствие имущества\"?","o":[["У клиента нет активов на балансе",0],["У клиента все активы в аренде, а в собственности ничего нет",0],["Клиент не использует имущество в бизнесе, хотя вид деятельности подразумевает его наличие",1]],"n":[]},{"t":"Комплаенс-риски","q":"Что потребуется сделать, если у клиента при открытии счёта появилось уведомление об установке лимитов?","o":[["Ничего не говорить клиенту",0],["Уведомить клиента о возможных лимитах",0],["Уведомить клиента о примененных лимитах и рассказать о расширенных лимитах",1]],"n":[]},{"t":"Кредит на цели рефинансирования (базовый)","q":"Какие кредитные продукты недопустимо рефинансировать?","o":[["Кредиты в форме ВКЛ",0],["Овердрафты",1],["Потребительские кредиты",1],["Кредиты в форме единовременной выдачи",0],["Кредитные бизнес-карты",1]],"n":[],"a":"Рефинансируют только бизнес-кредиты (разовые, НКЛ, ВКЛ). Овердрафты, кредитные карты и потребкредиты — нет."},{"t":"Кредит на цели рефинансирования (базовый)","q":"В рамках каких кредитных продуктов осуществляется рефинансирование кредитов?","o":[["Залоговый Лайт",1],["Бизнес-Кредит",1],["Бизнес-Кредит с залогом",1],["Возобновляемая кредитная линия",0],["ЛСПР",1],["Ломбардный кредит \"Деньги на дело\"",1]],"n":[],"a":"ВКЛ — не продукт для рефинансирования. Все остальные из списка подходят."},{"t":"Кредит на цели рефинансирования (базовый)","q":"Какую программу для рефинансирования можно предложить клиенту, если в рамках «Залоговый лайт» лимит не рассчитался?","o":[["Бизнес-Кредит с залогом",1],["ЛСПР",1],["Ломбардный кредит \"Деньги на дело\"",1],["Кредитная карта",0],["Возобновляемая кредитная линия",0],["Бизнес-кредит",1]],"n":[]},{"t":"Кредит на цели рефинансирования (базовый)","q":"Можно ли предложить рефинансирование клиенту, у которого есть действующие кредитные каникулы по 106-ФЗ?","o":[["Да",0],["Нет",1],["Возможно, при условии их действия не более 2 месяцев",0]],"n":[],"a":"Кредитные каникулы означают, что у клиента финансовые трудности. Рефинансировать такой долг банк не будет."},{"t":"Кредит на цели рефинансирования (базовый)","q":"В рамках внешнего рефинансирования можно выдать:","o":[["Только сумму кредита равную сумме задолженности в другом банке",0],["Сумму меньше задолженности в другом банке, при условии что остаток задолженности клиент погасит из собственных средств",1],["Сумму равную задолженности в другом банке",1],["Сумму равную задолженности в другом банке и дополнительные средства на развитие бизнеса клиента",1]],"n":[],"a":"Нельзя только «ровно равную сумму» как единственный вариант: можно меньше (остаток — своими), столько же или больше (плюс деньги на развитие)."},{"t":"Кредитная карта Business One Credit (базовый)","q":"В течение какого срока клиент должен погасить сформированный минимальный платёж:","o":[["В течение календарного месяца",1],["В установленный 14 дневной календарный срок",0],["В установленный 30 дневной календарный срок",0]],"n":[]},{"t":"Кредитная карта Business One Credit (базовый)","q":"В случае не погашения клиентом минимального платежа, который сформирован после срока действия льготного периода, банк:","o":[["Блокирует лимит кредитной карты",1],["Выносит минимальный платёж на просрочку",1],["Начисляет проценты за весь период пользования средствами банка",0],["Начинает начисление неустойки на просроченную задолженность и повышенной ставки на сумму основного долга",1]],"n":[]},{"t":"Кредитная карта Business One Credit (базовый)","q":"Когда начинается Льготный период по карте?","o":[["С даты возникновения первой задолженности по счёту",0],["С первого числа месяца, в котором совершена первая расходная операция по счёту",1],["Со следующего дня после даты возникновения первой задолженности по счёту",0]],"n":[],"a":"Льготный период считается не с даты покупки, а с 1-го числа месяца первой траты."},{"t":"Кредитная карта Business One Credit (базовый)","q":"Укажите срок ведения бизнеса (кредитная карта)","o":[["Срок ведения бизнеса не анализируется",1],["В зависимости от суммы кредитования лимита, равном 50 000 ₽ срок не анализируется",0],["Для лимита в размере от 50 000 ₽ до 500 000 ₽ (включительно) — не менее 3 месяцев на дату подачи заявки на предоставление кредитного продукта",0],["Для лимита в размере от 500 000 ₽ до 1 000 000 ₽ (включительно) — не менее 6 месяцев на дату подачи заявки на предоставление кредитного продукта",0],["Для лимита кредитования 50 000 ₽ — не анализируется, для лимита свыше — на усмотрение рисковой стратегии",0]],"n":[],"a":"Карта выдаётся по скорингу, поэтому срок ведения бизнеса не анализируется."},{"t":"Кредитная карта Business One Credit (базовый)","q":"Выберите условия списания комиссии за обслуживание кредитной карты","o":[["Один раз в год в размере 1590 ₽ (без учёта НДС) тариф Базовый",0],["0 ₽ тариф Базовый",1],["Один раз в год в размере 9590 ₽ (без учёта НДС) тариф Премиальный",0],["Ежемесячно 1799 ₽ (без учёта НДС) тариф Премиальный",1]],"n":[]},{"t":"Кредитная карта Business One Credit (продвинутый)","q":"Анализируется ли срок ведения бизнеса для получения карты (карта по скорингу OW)?","o":[["Да",0],["Нет",1]],"n":[]},{"t":"Кредитная карта Business One Credit (продвинутый)","q":"Какая стоимость перевыпуска карты по инициативе клиента?","o":[["Перевыпуск бесплатный",0],["299 ₽ (без учёта НДС)",0],["500 ₽ (без учёта НДС)",1],["Перевыпуск по инициативе клиента не предусмотрен",0]],"n":[]},{"t":"Кредитная карта Business One Credit (продвинутый)","q":"Можно ли выпустить кредитную карту клиенту на виртуальном носителе?","o":[["Да" а. Позже — нельзя."},{"t":"Операционные риски (ММБ)","q":"Выберите возможные причины возникновения операционных рисков?","o":[["Сотрудник допустил ошибку при ручном вводе данных",1],["Клиент самостоятельно отправил деньги на счет мошенников",0],["Клиентам разослана некорректная информация об изменениях в тарифах банка",1],["В интернет-банке отображается некорректный статус платежа",1]],"n":[]},{"t":"Операционные риски (ММБ)","q":"Сотрудником банка при смене ПУ клиенту ИП был ошибочно подключен «ПУ «Высокие обороты» вместо ПУ «Ноль за обслуживание». В результате данных действий с клиента некорректно списывалась комиссия за обслуживание расчетного счета. Ошибка выявлена сотрудником на следующий день, проведены исправительные мероприятия. К какому типу потерь относятся последствия по данному инциденту?","o":[["Оценочные потери",0],["Near Miss",1],["Фактические потери",0],["Ожидаемые потери",0]],"n":[],"a":"Near Miss — «чуть не случилось»: ошибку нашли и исправили до того, как появились потери."},{"t":"Операционные риски (ММБ)","q":"К причине возникновения операционных рисков «внешние события» можно отнести:","o":[["Ручной процесс списания комиссий",0],["Недоступность интернет-банка",0],["Предоставление мошенниками поддельной доверенности",1],["Некорректную консультацию клиента",0]],"n":[],"a":"Внешние события — то, что пришло извне банка (мошенники, стихия). Ошибки сотрудников — человеческий фактор, ручные процессы — несовершенство процессов, сбои — системы."},{"t":"Операционные риски (ММБ)","q":"Человеческий фактор как причина возникновения операционных рисков выражается в:","o":[["Отсутствии регламента по процессу",0],["Предоставлении мошенниками поддельной доверенности",0],["Недоступности интернет-банка",0],["Некорректной консультации клиента",1]],"n":[]},{"t":"Операционные риски (ММБ)","q":"Каким видам операций присущ операционный риск?","o":[["Всем видам операций в банке",1],["Только сбоям в операционных системах банка",0],["Только операциям по реализации новых пр :[]},{"t":"Операционные риски (ММБ)","q":"В течение какого срока необходимо внести инцидент в базу операционных рисков SAS OpRisk Management?","o":[["В течении 3-х рабочих дней",1],["В течении 2-х календарных дней",0],["В течении 5-и календарных дней",0],["Срок не определен",0]],"n":[],"a":"Срок — 3 рабочих дня."},{"t":"Операционные риски (ММБ)","q":"Какие элементы управления операционными рисками существуют? (укажите наиболее полный ответ)","o":[["Не наказывать за операционные риски, открытость, ответственность и осведомленность о риске",1],["Не наказывать за операционные риски, открытость, ответственность и централизованность",0],["Не наказывать за операционные риски, ответственность и осведомленность о риске",0]],"n":["Все остальные ответы этого теста подтверждены зелёной шкалой прогресса; результат этого (последнего) вопроса на скрине не виден."]},{"t":"Отраслевые решения и отраслевые подписки","q":"С чего начать разговор с клиентом?","o":[["С выявления отрасли клиента",1],["Представиться должностью своего руководителя",0],["С презентации ПУ Ноль за обслуживание",0],["Спросить, в каком банке обслуживается клиент и почему",0]],"n":[],"a":"Отраслевой подход: сначала узнаём отрасль, под неё подбираем продукты."},{"t":"Отраслевые решения и отраслевые подписки","q":"Во время встречи в ресторане ты задаёшь клиенту вопросы о его бизнесе. В ходе разговора предприниматель рассказывает, что одна из главных проблем — работа с персоналом: сотрудников сложно удерживать, качество сервиса нестабильно, а иногда возникают случаи недобросовестного поведения со стороны работников. Какие решения стоит предложить клиенту?","o":[["Кредит, чтобы вовремя выплачивать зарплату или выдавать премии",0],["Массовые выплаты для расчётов с внештатным персоналом",1],["Проект нетмонет, который даёт возможность получать чаевые, повышает качество сервиса и мотивацию персонала, даёт дополнительные инструменты для развития бизнеса",1],["Подписка Альфа-Про, в которой есть возможность проверить до десяти сотрудников в месяц",1]],"n":[]},{"t":"Отраслевые решения и отраслевые подписки","q":"Во время встречи или звонка клиент говорит: «У меня уже есть расчётный счёт в другом банке, и меня всё устраивает». Какой ответ будет наиболее эффективным в логике отраслевого подхода?","o":[["Пакеты услуг и сервисы Альфа-Банка подстроены под нужды именно вашей отрасли. Вы сможете управлять расчётным счётом, пользоваться интернет-бухгалтерией и другими продуктами в одном окне",1],["Если у вас есть партнёры, у которых открыт счёт в Альфа-Банке, вы сможете мгновенно и бесплатно проводить с ними расчёты, деньги поступают на счёт даже в выходные",0],["За привычные операции в Альфа-Банке мы начисляем бонусные баллы в рамках программы лояльности",0],["Завершить разговор, поскольку клиент сообщил, что его устраивает текущий банк",0]],"n":[],"a":"Логика отраслевого подхода: говорим не о банке вообще, а о решениях для бизнеса этого клиента."},{"t":"Отраслевые решения и отраслевые подписки","q":"Ты звонишь потенциальному клиенту. В SFA или СПАРК ты видишь, что у клиента основной ОКВЭД 56 — общепит. Клиент резко говорит: «Мне неинтересны предложения от банка, не тратьте время». Что будет наиболее эффективным в логике отраслевого подхода?","o":[["Вежливо завершить разговор, чтобы не раздражать клиента",0],["Продолжить звонок и рассказать о стандартных преимуществах РКО",0],["Продолжить разговор и рассказать о подписке Ресторан Про — уникальном продукте для общепита, которого нет ни в одном банке",1],["Завершить разговор, отправить коммерческое предложение по ПУ, подписке Ресторан Про и отраслевому решению для кафе, ресторанов и доставки. Вернуться к клиенту завтра",1]],"n":[]},{"t":"Отраслевые решения и отраслевые подписки","q":"Клиент занимается строительством. На встрече он рассказывает, что регулярно привлекает внештатных рабочих и подрядчиков. Для оплаты их услуг приходится искать способы быстро перевести деньги физическим лицам. Кроме того, периодически возникают проблемы с недобросовестными сотрудниками и воровством. Что стоит предложить клиенту?","o":[["Массовые выплаты для удобных переводов внештатным сотрудникам и подрядчикам",1],["Подписка Альфа-Про, в которой есть возможность проверить до десяти сотрудников в месяц",1],["Кредит для выплаты заработной платы",0],["Факторинг",0]],"n":[]},{"t":"Отраслевые решения и отраслевые подписки","q":"Клиент продаёт товары на маркетплейсах и закупает продукцию на китайских площадках как физлицо. Что будет наиболее актуально для такого клиента?","o":[["Отраслевая подписка для маркетплейсов с увеличенными лимитами переводов физическим лицам без комиссии и возможностью повысить лимит за счёт перевода выручки в Альфа-Банк",1],["Предложить ПУ Ноль за обслуживание, не разбираясь в специфике бизнеса",0],["Кредит на закупку товара",0],["Факторинг",0]],"n":[],"a":"Закупки как физлицо требуют переводов себе на карту, поэтому подходит подписка с увеличенными лимитами переводов физлицам."},{"t":"Отраслевые решения и отраслевые подписки","q":"Во время встречи владелец строительной компании говорит: «Хотелось бы начать работать с государственными заказами, но пока не понимаю, где искать подходящие тендеры и как оценивать свои шансы на победу». Какое решение лучше всего подойдёт клиенту?","o":[["Сервис Госзакупки в интернет-банке, который помогает искать тендеры, изучать условия участия и оценивать вероятность победы",1],["Кредит на пополнение оборотных средств",0],["Факторинг",0],["ПУ Ноль за обслуживание в качестве резервного счёта",0]],"n":[]},{"t":"Отраслевые решения и отраслевые подписки","q":"Клиент занимается электронной коммерцией через собственный интернет-магазин. Часть товара он закупает как физическое лицо на иностранных маркетплейсах. Какие решения помогут закрыть его потребности?","o":[["Подписка Альфа eCom с увеличенными лимитами на переводы физическим лицам без комиссии",1],["Предложить ПУ Ноль за обслуживание, не уточняя особенности бизнеса клиента",0],["Альфа-Таргет для поиска новых покупателей среди а транша",1],["Клиенту доступен выбор даты ежемесячного платежа",1],["Погашение процентов и основного долга происходит ежемесячно",0]],"n":[],"a":"«Буллит» (bullet — пуля): основной долг гасится одним платежом в конце, а каждый месяц платятся только проценты. Ежемесячное погашение и процентов, и долга — это дифференцированный график."},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Какие виды ВКЛ доступны для оформления?","o":[["Без залога",0],["С Залогом (залоговый лайт)",0],["Возможны оба варианта на выбор клиента",1]],"n":[]},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Кредитный транш по ВКЛ - это:","o":[["Часть кредитного лимита, предоставляется автоматически, как только на платежи перестанет хватать собственных средств на счете",0],["Ежемесячный платеж по линии",0],["Сумма кредитной линии по договору",0],["Кредитные денежные средства, предоставляемые в течение периода выборки в пределах лимита задолженности по договору (формируется по запросу клиента)",1]],"n":["⚠ По счётчику ошибка была либо в этом вопросе, либо в предыдущем (не заскриненном)."],"a":"Транш по ВКЛ берётся по запросу клиента. Если деньги приходят автоматически при нехватке средств на счёте — это овердрафт, а не ВКЛ."},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"В течение какого времени можно брать транш ВКЛ (без залога)?","o":[["Транши можно брать в первые 12 месяцев договора",1],["Транши можно брать в течение всего срока договора (18 месяцев)",0]],"n":["⚠ По счётчику ошибка была либо в этом вопросе, либо в предыдущем (не заскриненном). В базовом тесте по ВКЛ этот же ответ отмечен верным."],"a":"Договор действует 18 месяцев: первые 12 — период выборки (можно брать транши), оставшиеся 6 — чтобы погасить последние транши (максимальный срок транша — 6 мес)."},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Для чего подойдет ВКЛ?","o":[["Закупить товары и материалы",1],["Оплатить налоги",1],["Оплатить зарплату сотрудников",1],["Погасить другой кредит",0],["Оплатить аренду",1]],"n":[],"a":"ВКЛ даётся на пополнение оборотных средств. Погашение другого кредита — это рефинансирование, а не оборотная цель."},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Выберете особенности досрочного погашения ВКЛ:","o":[["При частичном досрочном погашении платежи по графику уменьшаются на сумму досрочного погашения начиная с последнего по сроку платежа",1],["При частичном досрочном погашении платежи по графику уменьшаются на сумму досрочного погашения начиная с ближайшего по сроку платежа",0],["Комиссия за досрочное погашение кредита с клиента не взимается",1],["Досрочное погашение ВКЛ не предусмотрено",0]],"n":[]},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Какой минимальный срок ведения бизнеса для предоставления ВКЛ?","o":[["От 0 месяцев",0],["Не менее 6 мес",0],["Не менее 9 мес",1],["Не менее 18 мес",0]],"n":[]},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Наличие какого кредитного продукта у клиента на одном расчетном счете является блокатором для оформления ВКЛ (на тот же расчетный счет)?","o":[["Овердрафт",1],["Бизнес-Кредит",0],["Партнер",0]],"n":[],"a":"Овердрафт и ВКЛ — оба лимиты на один и тот же расчётный счёт, поэтому на одном счёте они не совмещаются. Обычные кредиты (Бизнес-Кредит, Партнёр) не мешают."},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Какие особенности есть у ВКЛ?","o":[["Можно несколько раз брать транши в пределах лимита",1],["В рамках лимита можно взять транш только единоразово",0],["Лимит по мере погашения взятых траншей восстанавливается",1],["Лимит по мере погашения взятых траншей не восстанавливается",0]],"n":[]},{"t":"ВКЛ — Возобновляемая кредитная линия (продвинутый)","q":"Как клиент может узнать когда и сколько нужно заплатить по ВКЛ?","o":[["В личном кабинете Интернет-банка в разделе \"Кредитные продукты\"",0],["Информацию о дате ежемесячного платежа и о дате окончания траншей можно посмотреть в кредитно кольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены."],"a":"Собственный капитал = Активы − Обязательства = (1000 + 500 + 800) − 200 = 2100 т. ₽."},{"t":"ФЭА Hard","q":"Сгруппируйте имущество от самого ликвидного к менее ликвидному:","o":[["1. Денежные средства",1],["2. Товары",1],["3. Транспорт (2023 года выпуска)",1],["4. Недвижимость",1]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","Вопрос на сортировку — записан порядок как на скрине. ⚠ Не подтверждён счётчиком на 100%."],"a":"Ликвидность — скорость превращения в деньги: деньги уже деньги → товар продаётся быстро → машину продать дольше → недвижимость дольше всего."},{"t":"ФЭА Hard","q":"Структура ОПИУ вертикально выглядит как:","o":[["Выручка - Себестоимость = Валовая прибыль",0],["Выручка - Себестоимость = Валовая прибыль - Общие расходы = Прибыль до налогообложения - Налог на прибыль = Чистая прибыль - Погашение действующей кредитной нагрузки - Дивиденды = Свободный остаток",0],["Выручка - Общие расходы = Свободный остаток",0],["Выручка - Себестоимость - Общие расходы - Погашение кредитной нагрузки = Свободный остаток - Дивиденды = Платеж по утверждаемому кредиту",3]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","⚠ На скрине выбран длинный вариант (2-й), но по счётчикам двух попыток он, скорее всего, засчитан НЕВЕРНО. Жёлтым — предположение ИИ, тестом не подтверждено."],"a":"Методика банка заканчивается не на чистой прибыли, а на том, сколько клиент может платить по новому кредиту. Поэтому вероятный ответ — вариант, который заканчивается «Платежом по утверждаемому кредиту»."},{"t":"ФЭА Hard","q":"Отметьте источник официального учета для помесячного анализа выручки клиента:","o":[["Общая оборотная ведомость (ОСВ) за период анализа",0],["ОСВ по счету 62 в разрезе субсчетов за период анализа",0],["Карточка счета 90 за период анализа",1],["Карточка счета 99 за период анализа",0],["ОСВ по счету 60 в разрезе субсчетов за период анализа",0]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","⚠ Вероятно верно (по счётчикам), но не подтверждено на 100%."],"a":"Счёт 90 «Продажи» — на нём отражается выручка, а его карточка показывает её помесячно. 62 — расчёты с покупателями, 60 — с поставщиками, 99 — прибыли и убытки."},{"t":"ФЭА Hard","q":"Что является источником погашения инвестиционных кредитов?","o":[["Выручка компании/группы связанных лиц",0],["Чистая прибыль компании/группы связанных лиц",1],["Валовая прибыль компании/группы связанных лиц",0],["Валовый денежный поток компании/группы связанных лиц по счетам в банке",0]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","Вероятно верно (по счётчикам)."],"a":"Инвестиционный кредит окупается за счёт того, что остаётся после всех расходов, — чистой прибыли. Выручка уходит на текущие расходы."},{"t":"ФЭА Hard","q":"Отметьте счет учета контрагентов-поставщиков:","o":[["Счет 90",0],["Счет 60",1],["Счет 51",0],["Счет 62",0]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены."],"a":"По плану счетов: 60 — поставщики, 62 — покупатели, 51 — расчётный счёт, 90 — продажи."},{"t":"ФЭА Hard","q":"Оборачиваемость ДЗ была 15 дней, через 6 мес. стала 30 дней. О чем говорят данные изменения?","o":[["Покупатели стали рассчитываться быстрее",0],["Отрицательная динамика выручки",0],["Положительная динамика выручки без изменения условий расчетов",0],["Изменились условия расчетов с покупателями",1],["Проблемы с оплатой счетов у покупателей",1]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","⚠ Не подтверждено на 100%: в этой попытке одна ошибка была в одном из трёх вопросов подряд (источник погашения / счёт 60 / этот)."],"a":"Покупатели стали платить в 2 раза дольше: значит, им дали отсрочку побольше или у них проблемы с оплатой. О выручке это напрямую не говорит."},{"t":"ФЭА Hard","q":"При анализе деятельности по расчетному счету заемщика можно выявить:","o":[["Расходные операции",1],["Основных контрагентов",1],["Стабильность и периодичность поступлений",1],["Действующие обязательства компании (кредиты, лизинги, займы)",1],["Остатки товарно материальных ценностей",0],["Состав активов предприятия",0]],"n":["В Word нет пометок верно/неверно. Скрины из нескольких попыток с ошибками; вывод сделан по счётчикам «Правильно/Неправильно». Вопросы с ⚠ точно не подтверждены.","⚠ Не подтверждено: скрин сделан до отправки ответа."],"a":"По выписке видны только денежные движения: кто платит, кому платят, платежи по кредитам. Склад и состав активов по выписке не увидеть."},{"t":"ФЭА Medium","q":"Что такое кредиторская задолженность для компании? Выберете верный ответ:","o":[["Задолженность компании перед своими контрагентами",1],["Задолженность контрагентов перед компанией",0],["Задолженность покупателей",0],["Задолженность поставщиков",0]],"n":["Под каждым скрином в Word стоит пометка «Верно!»"],"a":"Кредиторка — мы должны (пассив), дебиторка — нам должны (актив)."},{"t":"ФЭА Medium","q":"Отметьте верное утверждение, Методике ЕБРР характерно:","o":[["Оценка и анализ реального состояния бизнеса",0],["Отражение реальных расходов",0],["Подтверждение управленческой выручки",0],["Раскрытие схемы оптимизации налогообложения",0],["Бизнес и бизнесмен оценивают как единое целое",0],["Все утверждения верны",1]],"n":["Под каждым скрином в Word стоит пометка «Верно!»"], const STOP = new Set('в во и или по на с со к ко о об а ли для из от до при за у же то это что как какой какая какие каким каких'.split(' '));
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9%]+/g, ' ').trim();
const words = s => norm(s).split(' ').filter(Boolean);
const stem = w => w.length >= 6 ? w.slice(0, -2) : w.length >= 4 ? w.slice(0, -1) : w;
function lev1(a, b) { // расстояние Левенштейна <= 1
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return d + (a.length - i) + (b.length - j) <= 1;
}
DATA.forEach((d, i) => {
  d.i = i;
  d.qw = words(d.q);
  d.ow = words(d.o.map(o => o[0]).join(' '));
  d.tw = words(d.t);
  d.nq = norm(d.q);
  d.glued = d.nq.replace(/ /g, '');
});
const topics = [...new Set(DATA.map(d => d.t))];
const sel = document.getElementById('topic');
topics.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t + ' (' + DATA.filter(d => d.t === t).length + ')'; sel.appendChild(o); });
document.getElementById('cnt').textContent = 'Всего вопросов: ' + DATA.length + ', тем: ' + topics.length;

function hit(list, st) {
  for (const w of list) if (w.startsWith(st)) return 2;
  if (st.length >= 5) for (const w of list) if (w.length >= st.length - 1 && lev1(st, w.slice(0, st.length))) return 1;
  return 0;
}
function search(query, topic) {
  const pool = topic ? DATA.filter(d => d.t === topic) : DATA;
  const qt = words(query).filter(w => !STOP.has(w));
  if (!qt.length) return topic && !norm(query) ? pool.map(d => ({ d, s: 0 })) : null;
  const nq = norm(query), need = qt.length <= 2 ? qt.length : Math.ceil(qt.length * 0.6);
  const res = [];
  for (const d of pool) {
    let s = 0, m = 0;
    for (const t of qt) {
      const st = stem(t);
      const h = hit(d.qw, st);
      if (h) { s += h === 2 ? 3 : 0.8; m++; continue; }
      if (st.length >= 5 && d.glued.includes(st)) { s += 2; m++; continue; }
      if (hit(d.tw, st)) { s += 1.5; m++; continue; }
      if (hit(d.ow, st)) { s += 1; m++; }
    }
    if (m < need) continue;
    if (d.nq.includes(nq)) s += 6;
    res.push({ d, s: s + m / qt.length * 3 });
  }
  return res.sort((a, b) => b.s - a.s || a.d.q.length - b.d.q.length);
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hl(text, query) {
  const stems = words(query).filter(w => !STOP.has(w) && w.length > 1).map(stem);
  if (!stems.length) return esc(text);
  return text.split(/(\s+)/).map(p => {
    const n = norm(p);
    return n && stems.some(st => n.startsWith(st)) ? '<mark>' + esc(p) + '</mark>' : esc(p);
  }).join('');
}

const qEl = document.getElementById('q'), listEl = document.getElementById('list'), view = document.getElementById('view');
let results = [], cur = -1;
function show(d) {
  if (!d) { view.innerHTML = '<div class="muted">Введите вопрос в поиск — здесь появятся все варианты и правильный ответ.</div>'; return; }
  const nOk = d.o.filter(o => o[1] === 1 || o[1] === 3).length;
  let h = '<span class="tp">' + esc(d.t) + '</span><h2>' + esc(d.q) + '</h2>';
  h += '<div class="kind">' + (nOk > 1 ? 'Несколько правильных ответов (' + nOk + ')' : 'Один правильный ответ') + '</div>';
  for (const [text, s] of d.o) {
    const cls = ['', 'ok', 'bad', 'maybe'][s], mk = ['○', '✔', '✘', '?'][s];
    const sub = s === 2 ? '<small>НЕВЕРНО — так ответили в тесте, ответ не засчитан</small>' : s === 3 ? '<small>вероятно правильно, тестом не подтверждено</small>' : '';
    h += '<div class="opt ' + cls + '"><b>' + mk + '</b><div>' + esc(text) + sub + '</div></div>';
  }
  for (const n of d.n) h += '<div class="note' + (/⚠|НЕВЕРН|неверн|сомнен/.test(n) ? ' warn' : '') + '">' + esc(n) + '</div>';
  if (d.a) h += '<div class="ai"><b>🤖 Ответ ИИ — может ошибаться</b><div>' + esc(d.a) + '</div></div>';
  view.innerHTML = h;
  if (window.innerWidth <= 760) view.scrollIntoView({ block: 'nearest' });
}
function pick(i) {
  cur = i;
  [...listEl.querySelectorAll('.item')].forEach((el, k) => el.classList.toggle('sel', k === i));
  const el = listEl.querySelectorAll('.item')[i];
  if (el) el.scrollIntoView({ block: 'nearest' });
  show(results[i] && results[i].d);
}
function run() {
  const query = qEl.value, r = search(query, sel.value);
  if (r === null) {
    results = []; cur = -1;
    listEl.innerHTML = '<div class="info">Начните вводить вопрос — подсказки появятся сразу.<br>Можно выбрать тему справа, чтобы увидеть все её вопросы.</div>';
    show(null); return;
  }
  results = r.slice(0, 60);
  if (!results.length) {
    cur = -1;
    listEl.innerHTML = '<div class="info">Попробуйте другие слова или уберите фильтр темы.</div>';
    view.innerHTML = '<div class="none">Ничего не найдено</div><div class="muted">Такого вопроса нет в базе.</div>';
    return;
  }
  listEl.innerHTML = results.map(({ d }) => '<div class="item"><div>' + hl(d.q, query) + '</div><div class="tp">' + esc(d.t) + '</div></div>').join('')
    + (r.length > results.length ? '<div class="info">…и ещё ' + (r.length - results.length) + '. Уточните запрос.</div>' : '');
  listEl.querySelectorAll('.item').forEach((el, k) => el.onclick = () => pick(k));
  pick(0);
}
qEl.addEventListener('input', run);
sel.addEventListener('change', run);
qEl.addEventListener('keydown', e => {
  if (!results.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); pick(Math.min(cur + 1, results.length - 1)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); pick(Math.max(cur - 1, 0)); }
});
run();
</script>
